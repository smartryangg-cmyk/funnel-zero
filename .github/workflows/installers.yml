name: Installers

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "installers/KRANO-Installer-Windows-x64.exe"
      - "installers/krano-installer-linux-x64"
      - "installers/SHA256SUMS.txt"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "installer/**"
      - "installers/KRANO-Installer-Windows-x64.exe"
      - "installers/krano-installer-linux-x64"
      - "installers/SHA256SUMS.txt"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Verify published downloads
        run: |
          file installers/KRANO-Installer-Windows-x64.exe | grep -q "PE32+ executable.*x86-64"
          file installers/krano-installer-linux-x64 | grep -q "ELF 64-bit.*x86-64"
          (cd installers && sha256sum --check SHA256SUMS.txt)
      - name: Test source
        run: go test ./installer
      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o installers/KRANO-Installer-Windows-x64.exe ./installer
      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o installers/krano-installer-linux-x64 ./installer
      - name: Verify rebuilt executables
        run: |
          file installers/KRANO-Installer-Windows-x64.exe | grep -q "PE32+ executable.*x86-64"
          file installers/krano-installer-linux-x64 | grep -q "ELF 64-bit.*x86-64"
          ./installers/krano-installer-linux-x64 --version | grep -q "KRANO Installer"
          (cd installers && sha256sum KRANO-Installer-Windows-x64.exe krano-installer-linux-x64 > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: krano-installers
          path: |
            installers/KRANO-Installer-Windows-x64.exe
            installers/krano-installer-linux-x64
            installers/SHA256SUMS.txt
