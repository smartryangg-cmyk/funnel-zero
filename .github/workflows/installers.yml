name: Installers

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test source
        run: go test ./installer
      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o installers/KRANO-Installer-Windows-x64.exe ./installer
      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o installers/krano-installer-linux-x64 ./installer
      - uses: actions/upload-artifact@v4
        with:
          name: krano-installers
          path: |
            installers/KRANO-Installer-Windows-x64.exe
            installers/krano-installer-linux-x64
