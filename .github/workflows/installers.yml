name: Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "installer/**"
      - "installers/KRANO-Installer-Windows-x64.exe"
      - "installers/krano-installer-linux-x64"
      - "installers/SHA256SUMS.txt"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "installer/**"
      - "installers/KRANO-Installer-Windows-x64.exe"
      - "installers/krano-installer-linux-x64"
      - "installers/SHA256SUMS.txt"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Test source
        run: go test ./installer
      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p release
          go build -trimpath -ldflags="-s -w -buildid=" -o release/KRANO-Installer-Windows-x64.exe ./installer
      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -buildid=" -o release/krano-installer-linux-x64 ./installer
      - name: Verify deterministic build and checked-in downloads
        run: |
          mkdir -p release-repeat
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -buildid=" \
            -o release-repeat/KRANO-Installer-Windows-x64.exe ./installer
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -buildid=" \
            -o release-repeat/krano-installer-linux-x64 ./installer
          cmp release/KRANO-Installer-Windows-x64.exe release-repeat/KRANO-Installer-Windows-x64.exe
          cmp release/krano-installer-linux-x64 release-repeat/krano-installer-linux-x64
          file release/KRANO-Installer-Windows-x64.exe | grep -q "PE32+ executable.*x86-64"
          file release/krano-installer-linux-x64 | grep -q "ELF 64-bit.*x86-64"
          ./release/krano-installer-linux-x64 --version | grep -q "KRANO Installer 0.2.0"
          file installers/KRANO-Installer-Windows-x64.exe | grep -q "PE32+ executable.*x86-64"
          file installers/krano-installer-linux-x64 | grep -q "ELF 64-bit.*x86-64"
          ./installers/krano-installer-linux-x64 --version | grep -q "KRANO Installer 0.2.0"
          (cd installers && sha256sum --check SHA256SUMS.txt)
          (cd release && sha256sum krano-installer-linux-x64 KRANO-Installer-Windows-x64.exe > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: krano-installers
          path: |
            release/KRANO-Installer-Windows-x64.exe
            release/krano-installer-linux-x64
            release/SHA256SUMS.txt
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "KRANO ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" \
            release/KRANO-Installer-Windows-x64.exe \
            release/krano-installer-linux-x64 \
            release/SHA256SUMS.txt \
            --clobber
